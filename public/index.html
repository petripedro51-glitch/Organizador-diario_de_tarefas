<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Tarefas - Início</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #030303; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        main { background-color: #04165044; padding: 60px; border-radius: 10px; border: 5px solid #0c0752; text-align: center; display: flex; flex-direction: column; gap: 20px; width: 350px; }
        h1 { font-size: 2em; margin-bottom: 10px; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; }
        a { text-decoration: none; padding: 12px; border-radius: 4px; font-weight: bold; text-align: center; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: transparent; border: 2px solid #007bff; color: white; }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <main>
        <h1>Organizador de Tarefas</h1>
        <p>Gere as tuas rotinas de forma simples e segura.</p>
        <div class="btn-container">
            <a href="login.html" class="btn-primary">Entrar (Login)</a>
            <a href="cadastro.html" class="btn-secondary">Criar Conta</a>
        </div>
    </main>
</body>
</html>
