<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Organizador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #030303; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        main { background-color: #04165044; padding: 40px; border-radius: 10px; border: 5px solid #0c0752; width: 350px; }
        h2 { text-align: center; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; }
        input { padding: 10px; border: none; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        p { text-align: center; margin-top: 15px; font-size: 0.9em; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h2>Entrar</h2>
        <form id="form-login">
            <label for="user">Utilizador:</label>
            <input type="text" id="user" required>

            <label for="password">Palavra-passe:</label>
            <input type="password" id="password" required>

            <button type="submit">Entrar</button>
        </form>
        <p>Não tens conta? <a href="cadastro.html">Regista-te</a></p>
    </main>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (event) => {
            event.preventDefault();

            const user = document.getElementById('user').value;
            const password = document.getElementById('password').value;

            try {
                const resposta = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, password }) // Corrigido de username para user
                });

                const dados = await resposta.json();
                alert(dados.mensagem);

                if (resposta.ok) {
                    // Guarda o utilizador logado no localStorage para usar na página principal
                    localStorage.setItem('usuarioLogado', dados.user);
                    window.location.href = 'organizadorMain.html';
                }
            } catch (erro) {
                console.error("Erro no login:", erro);
                alert("Não foi possível conectar ao servidor.");
            }
        });
    </script>
</body>
</html>
